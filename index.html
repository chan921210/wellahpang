<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>웰라팡</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #181926;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      width: 90%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
    }
    .badge span { color: #feca57; font-size: 17px; }
    #timer.warning { color: #ff4757; }

    /* BGM 컨트롤 버튼 */
    .btn-sound {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      background: #242638;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: block;
    }

    /* 팝업 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: #ffffff;
      color: #2d3436;
      padding: 28px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .modal-content h2 { font-size: 22px; margin-bottom: 4px; color: #1e1e2f; }
    .modal-content p.desc { font-size: 13px; color: #636e72; margin-bottom: 16px; }
    .score-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .score-title { font-size: 12px; color: #888; margin-bottom: 2px; }
    .score-value { font-size: 28px; color: #e84118; font-weight: 900; }

    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { font-size: 12px; font-weight: bold; color: #636e72; display: block; margin-bottom: 4px; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #dfe6e9;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .input-group input:focus { border-color: #e84118; }
    
    .consent-box {
      font-size: 12px;
      color: #636e72;
      text-align: left;
      margin: 14px 0 18px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }
    .consent-box input { margin-top: 3px; accent-color: #e84118; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #e84118;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(232, 65, 24, 0.3);
    }
    .btn-submit:disabled { background: #b2bec3; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- BGM 오디오 태그 -->
  <audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>

  <div class="header">
    <div class="header-left">
      <div class="badge">남은 시간: <span id="timer">60</span>s</div>
      <button class="btn-sound" id="btnSound" onclick="toggleSound()">🔊</button>
    </div>
    <div class="badge">점수: <span id="score">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- 게임 종료 및 이벤트 응모 모달 -->
  <div class="modal" id="resultModal">
    <div class="modal-content">
      <h2>🎉 게임 종료!</h2>
      <p class="desc">이벤트 참여 정보를 입력해 주세요.</p>
      
      <div class="score-card">
        <div class="score-title">최종 획득 점수</div>
        <div class="score-value"><span id="finalScore">0</span>점</div>
      </div>
      
      <div class="input-group">
        <label for="userName">이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요">
      </div>
      <div class="input-group">
        <label for="userPhone">휴대폰 번호</label>
        <input type="tel" id="userPhone" placeholder="01012345678 (- 없이 입력)" maxlength="11">
      </div>
      
      <div class="consent-box">
        <input type="checkbox" id="consentCheck">
        <label for="consentCheck">[필수] 이벤트 추첨 및 경품 발송을 위한 개인정보 수집 및 이용에 동의합니다.</label>
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="submitEntry()">응모하기</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. 설정
    // ==========================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpQdc5Y88jg9K5tkIXEBFJQBgX1kUDg4IOcHeJ2K8LVldoff0Mrd57L7Ri_JmkrOfA/exec";

    const GRID_SIZE = 6;
    const CANVAS_WIDTH = 340;
    const CANVAS_HEIGHT = 340;
    const TILE_SIZE = CANVAS_WIDTH / GRID_SIZE;

    const TYPE_BOMB = 5;
    const TYPE_CROSS = 6;
    const TYPE_FEVER = 7;

    const IMAGE_SOURCES = {
      0: "item1.png",
      1: "item2.png",
      2: "item3.png",
      3: "item4.png",
      4: "item5.png",
      5: "bomb.png",
      6: "cross.png",
      7: "fever.png"
    };

    const TILE_BG_COLORS = [
      "#e5d4ff", "#e5d4ff", "#e5d4ff", "#e5d4ff", "#e5d4ff",
      "#ffd1d1", "#d8f8b7", "#ffeaa7"
    ];

    const images = {};
    for (let key in IMAGE_SOURCES) {
      const img = new Image();
      img.src = IMAGE_SOURCES[key];
      img.onload = () => { images[key] = img; };
      img.onerror = () => { images[key] = null; };
    }

    // ==========================================
    // 🎵 BGM 컨트롤
    // ==========================================
    const bgm = document.getElementById("bgmAudio");
    const btnSound = document.getElementById("btnSound");
    let isBgmPlaying = false;

    function playBgmFirstTouch() {
      if (!isBgmPlaying && bgm.paused) {
        bgm.play().then(() => {
          isBgmPlaying = true;
          btnSound.innerText = "🔊";
        }).catch(() => {});
      }
    }

    function toggleSound() {
      if (bgm.paused) {
        bgm.play();
        btnSound.innerText = "🔊";
        isBgmPlaying = true;
      } else {
        bgm.pause();
        btnSound.innerText = "🔇";
        isBgmPlaying = false;
      }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    let board = [];
    let particles = [];
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let isGameOver = false;
    let isBusy = false;

    let startPos = null;
    let startTile = null;

    function fillRoundedRect(x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function getRandomNormalTile() {
      return Math.floor(Math.random() * 5);
    }

    function createTileObj(type, r, c, startOffsetCount = 0) {
      const targetX = c * TILE_SIZE;
      const targetY = r * TILE_SIZE;
      return {
        type: type,
        x: targetX,
        y: startOffsetCount > 0 ? targetY - (startOffsetCount * TILE_SIZE) : targetY,
        targetX: targetX,
        targetY: targetY,
        scale: 1,
        alpha: 1
      };
    }

    function initBoard() {
      for (let r = 0; r < GRID_SIZE; r++) {
        board[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          board[r][c] = createTileObj(getRandomNormalTile(), r, c);
        }
      }
      resolveInitialMatches();
    }

    function resolveInitialMatches() {
      let matched = checkMatchesOnly();
      while (matched.length > 0) {
        matched.forEach(({ r, c }) => {
          board[r][c].type = getRandomNormalTile();
        });
        matched = checkMatchesOnly();
      }
    }

    function spawnParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + TILE_SIZE / 2,
          y: y + TILE_SIZE / 2,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10 - 2,
          size: Math.random() * 6 + 3,
          color: color || "#feca57",
          life: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const tile = board[r][c];
          if (!tile) continue;

          const dx = tile.targetX - tile.x;
          const dy = tile.targetY - tile.y;
          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            tile.x += dx * 0.3;
            tile.y += dy * 0.3;
          } else {
            tile.x = tile.targetX;
            tile.y = tile.targetY;
          }

          if (tile.type === -1) continue;

          const size = TILE_SIZE - 8;
          const px = tile.x + 4;
          const py = tile.y + 4;

          ctx.save();
          ctx.globalAlpha = tile.alpha;
          fillRoundedRect(px, py, size, size, 12, TILE_BG_COLORS[tile.type] || "#343752");

          if (images[tile.type] && images[tile.type].complete && images[tile.type].naturalWidth > 0) {
            ctx.drawImage(images[tile.type], px + 3, py + 3, size - 6, size - 6);
          }
          ctx.restore();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 👆 터치 & 마우스 조작
    // ==========================================
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function handleStart(e) {
      playBgmFirstTouch(); // 첫 터치 시 BGM 자동 재생
      if (isGameOver || isBusy) return;
      const pos = getCoords(e);
      const col = Math.floor(pos.x / TILE_SIZE);
      const row = Math.floor(pos.y / TILE_SIZE);
      if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
        startPos = pos;
        startTile = { row, col };
      }
    }

    async function handleEnd(e) {
      if (!startPos || !startTile || isGameOver || isBusy) return;
      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const rect = canvas.getBoundingClientRect();
      const dx = (clientX - rect.left) - startPos.x;
      const dy = (clientY - rect.top) - startPos.y;

      const currentTile = board[startTile.row][startTile.col];

      // 단독 탭 아이템 발동
      if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
        if (currentTile && currentTile.type >= 5) {
          isBusy = true;
          await triggerItemTap(startTile.row, startTile.col, currentTile.type);
          await applyGravity();
          await processCascade();
          isBusy = false;
          startPos = null;
          startTile = null;
          return;
        }
      }

      // 스와이프 조작
      let targetTile = null;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
        targetTile = { row: startTile.row, col: startTile.col + (dx > 0 ? 1 : -1) };
      } else if (Math.abs(dy) > 20) {
        targetTile = { row: startTile.row + (dy > 0 ? 1 : -1), col: startTile.col };
      }

      if (targetTile && targetTile.row >= 0 && targetTile.row < GRID_SIZE && targetTile.col >= 0 && targetTile.col < GRID_SIZE) {
        await executeSwap(startTile, targetTile);
      }

      startPos = null;
      startTile = null;
    }

    canvas.addEventListener("touchstart", handleStart, { passive: false });
    canvas.addEventListener("touchend", handleEnd, { passive: false });
    canvas.addEventListener("mousedown", handleStart);
    canvas.addEventListener("mouseup", handleEnd);

    async function executeSwap(t1, t2) {
      isBusy = true;
      const tile1 = board[t1.row][t1.col];
      const tile2 = board[t2.row][t2.col];

      tile1.targetX = t2.col * TILE_SIZE;
      tile1.targetY = t2.row * TILE_SIZE;
      tile2.targetX = t1.col * TILE_SIZE;
      tile2.targetY = t1.row * TILE_SIZE;
      board[t1.row][t1.col] = tile2;
      board[t2.row][t2.col] = tile1;

      await sleep(220);

      // 특수 아이템 간 조합 판정
      if (tile1.type >= 5 && tile2.type >= 5) {
        await triggerComboSpecial(t2.row, t2.col, tile1.type, tile2.type);
        await applyGravity();
        await processCascade();
        isBusy = false;
        return;
      }

      // 특수 아이템 + 일반 타일 스왑
      if (tile1.type >= 5 || tile2.type >= 5) {
        let triggered = false;
        if (tile1.type === TYPE_FEVER || tile2.type === TYPE_FEVER) {
          const targetType = tile1.type === TYPE_FEVER ? tile2.type : tile1.type;
          board[t1.row][t1.col].type = -1;
          board[t2.row][t2.col].type = -1;
          await triggerFever(targetType);
          triggered = true;
        } else {
          if (tile1.type >= 5) triggerSpecialEffect(t2.row, t2.col, tile1.type);
          if (tile2.type >= 5) triggerSpecialEffect(t1.row, t1.col, tile2.type);
          triggered = true;
        }

        if (triggered) {
          await applyGravity();
          await processCascade();
          isBusy = false;
          return;
        }
      }

      // 일반 매칭 판정
      const matched = checkMatchesOnly();
      if (matched.length > 0) {
        await clearMatches(matched, t2);
        await applyGravity();
        await processCascade();
      } else {
        tile1.targetX = t1.col * TILE_SIZE;
        tile1.targetY = t1.row * TILE_SIZE;
        tile2.targetX = t2.col * TILE_SIZE;
        tile2.targetY = t2.row * TILE_SIZE;
        board[t1.row][t1.col] = tile1;
        board[t2.row][t2.col] = tile2;
        await sleep(220);
      }
      isBusy = false;
    }

    // ==========================================
    // 🌟 특수 아이템 결합(Combo)
    // ==========================================
    async function triggerComboSpecial(r, c, type1, type2) {
      const types = [type1, type2].sort();

      if (types[0] === TYPE_FEVER && types[1] === TYPE_FEVER) {
        for (let i = 0; i < GRID_SIZE; i++) {
          for (let j = 0; j < GRID_SIZE; j++) {
            spawnParticles(j * TILE_SIZE, i * TILE_SIZE, "#ffeaa7", 12);
            board[i][j].type = -1;
          }
        }
        addScore(10000);
      } else if (types[1] === TYPE_FEVER) {
        const specialTypeToSpawn = types[0];
        const mostType = getMostCommonNormalType();
        
        for (let i = 0; i < GRID_SIZE; i++) {
          for (let j = 0; j < GRID_SIZE; j++) {
            if (board[i][j].type === mostType || board[i][j].type === TYPE_FEVER) {
              board[i][j].type = specialTypeToSpawn;
              spawnParticles(j * TILE_SIZE, i * TILE_SIZE, "#ffeaa7", 6);
            }
          }
        }
        await sleep(300);
        
        for (let i = 0; i < GRID_SIZE; i++) {
          for (let j = 0; j < GRID_SIZE; j++) {
            if (board[i][j].type === specialTypeToSpawn) {
              triggerSpecialEffect(i, j, specialTypeToSpawn);
            }
          }
        }
        addScore(5000);
      } else if (types[0] === TYPE_BOMB && types[1] === TYPE_BOMB) {
        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
              if (board[nr][nc].type !== -1) {
                spawnParticles(nc * TILE_SIZE, nr * TILE_SIZE, "#ff7675", 10);
                board[nr][nc].type = -1;
                addScore(200);
              }
            }
          }
        }
        addScore(1500);
      } else if (types[0] === TYPE_BOMB && types[1] === TYPE_CROSS) {
        for (let offset = -1; offset <= 1; offset++) {
          const targetR = r + offset;
          if (targetR >= 0 && targetR < GRID_SIZE) {
            for (let i = 0; i < GRID_SIZE; i++) {
              if (board[targetR][i].type !== -1) {
                spawnParticles(i * TILE_SIZE, targetR * TILE_SIZE, "#55efc4", 6);
                board[targetR][i].type = -1;
                addScore(100);
              }
            }
          }
          const targetC = c + offset;
          if (targetC >= 0 && targetC < GRID_SIZE) {
            for (let i = 0; i < GRID_SIZE; i++) {
              if (board[i][targetC].type !== -1) {
                spawnParticles(targetC * TILE_SIZE, i * TILE_SIZE, "#55efc4", 6);
                board[i][targetC].type = -1;
                addScore(100);
              }
            }
          }
        }
        addScore(2000);
      } else if (types[0] === TYPE_CROSS && types[1] === TYPE_CROSS) {
        for (let i = 0; i < GRID_SIZE; i++) {
          if (board[r][i].type !== -1) {
            spawnParticles(i * TILE_SIZE, r * TILE_SIZE, "#a29bfe", 8);
            board[r][i].type = -1;
            addScore(150);
          }
          if (board[i][c].type !== -1) {
            spawnParticles(c * TILE_SIZE, i * TILE_SIZE, "#a29bfe", 8);
            board[i][c].type = -1;
            addScore(150);
          }
        }
        addScore(1000);
      }

      await sleep(200);
    }

    function getMostCommonNormalType() {
      const counts = {};
      for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
          const t = board[i][j].type;
          if (t >= 0 && t < 5) counts[t] = (counts[t] || 0) + 1;
        }
      }
      let mostType = 0, maxC = -1;
      for (let k in counts) {
        if (counts[k] > maxC) { maxC = counts[k]; mostType = parseInt(k); }
      }
      return mostType;
    }

    // ==========================================
    // 💥 단일 특수 아이템 효과
    // ==========================================
    async function triggerItemTap(r, c, type) {
      if (type === TYPE_FEVER) {
        const mostType = getMostCommonNormalType();
        board[r][c].type = -1;
        await triggerFever(mostType);
      } else {
        triggerSpecialEffect(r, c, type);
      }
    }

    function triggerSpecialEffect(r, c, type) {
      board[r][c].type = -1;
      spawnParticles(c * TILE_SIZE, r * TILE_SIZE, TILE_BG_COLORS[type], 10);

      if (type === TYPE_BOMB) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
              if (board[nr][nc].type !== -1) {
                spawnParticles(nc * TILE_SIZE, nr * TILE_SIZE, TILE_BG_COLORS[board[nr][nc].type]);
                board[nr][nc].type = -1;
                addScore(150);
              }
            }
          }
        }
      } else if (type === TYPE_CROSS) {
        for (let i = 0; i < GRID_SIZE; i++) {
          if (board[r][i].type !== -1) {
            spawnParticles(i * TILE_SIZE, r * TILE_SIZE, "#fff");
            board[r][i].type = -1;
            addScore(100);
          }
          if (board[i][c].type !== -1) {
            spawnParticles(c * TILE_SIZE, i * TILE_SIZE, "#fff");
            board[i][c].type = -1;
            addScore(100);
          }
        }
      }
    }

    async function triggerFever(targetType) {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] === targetType || targetType === TYPE_FEVER) {
            spawnParticles(c * TILE_SIZE, r * TILE_SIZE, "#feca57", 8);
            board[r][c].type = -1;
            addScore(250);
          }
        }
      }
      await sleep(150);
    }

    function addScore(pts) {
      score += pts;
      document.getElementById("score").innerText = score.toLocaleString();
    }

    // ==========================================
    // 🔍 매칭 및 연쇄 폭발
    // ==========================================
    function checkMatchesOnly() {
      let matched = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const type = board[r][c].type;
          if (type < 0 || type >= 5) continue;
          let len = 1;
          while (c + len < GRID_SIZE && board[r][c + len].type === type) len++;
          if (len >= 3) {
            for (let k = 0; k < len; k++) matched.push({ r, c: c + k, len, dir: 'h', type });
            c += len - 1;
          }
        }
      }
      for (let c = 0; c < GRID_SIZE; c++) {
        for (let r = 0; r < GRID_SIZE; r++) {
          const type = board[r][c].type;
          if (type < 0 || type >= 5) continue;
          let len = 1;
          while (r + len < GRID_SIZE && board[r + len][c].type === type) len++;
          if (len >= 3) {
            for (let k = 0; k < len; k++) matched.push({ r: r + k, c, len, dir: 'v', type });
            r += len - 1;
          }
        }
      }
      return matched;
    }

    async function clearMatches(matches, spawnPos = null) {
      let spawnSpecial = null;
      matches.forEach(m => {
        if (m.len >= 5) spawnSpecial = { r: m.r, c: m.c, type: TYPE_FEVER };
        else if (m.len === 4 && !spawnSpecial) spawnSpecial = { r: m.r, c: m.c, type: TYPE_BOMB };
        
        if (board[m.r][m.c].type !== -1) {
          spawnParticles(m.c * TILE_SIZE, m.r * TILE_SIZE, TILE_BG_COLORS[board[m.r][m.c].type]);
          board[m.r][m.c].type = -1;
          addScore(100);
        }
      });

      if (spawnSpecial) {
        const target = spawnPos || spawnSpecial;
        board[target.r || target.row][target.c || target.col].type = spawnSpecial.type;
      }
      await sleep(150);
    }

    async function processCascade() {
      while (true) {
        const matches = checkMatchesOnly();
        if (matches.length === 0) break;

        await clearMatches(matches);
        await applyGravity();
      }
    }

    async function applyGravity() {
      for (let c = 0; c < GRID_SIZE; c++) {
        let emptyRow = GRID_SIZE - 1;
        for (let r = GRID_SIZE - 1; r >= 0; r--) {
          if (board[r][c].type !== -1) {
            if (emptyRow !== r) {
              board[emptyRow][c] = board[r][c];
              board[emptyRow][c].targetY = emptyRow * TILE_SIZE;
              board[r][c] = createTileObj(-1, r, c);
            }
            emptyRow--;
          }
        }
        let newCount = 1;
        for (let r = emptyRow; r >= 0; r--) {
          board[r][c] = createTileObj(getRandomNormalTile(), r, c, newCount);
          newCount++;
        }
      }
      await sleep(280);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ==========================================
    // ⏱️ 타이머 및 응모
    // ==========================================
    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById("timer");
        timerEl.innerText = timeLeft;
        if (timeLeft <= 10) timerEl.classList.add("warning");

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isGameOver = true;
      if (bgm) bgm.pause(); // 게임 종료 시 BGM 정지
      document.getElementById("finalScore").innerText = score.toLocaleString();
      document.getElementById("resultModal").style.display = "flex";
    }

    async function submitEntry() {
      const name = document.getElementById("userName").value.trim();
      const phone = document.getElementById("userPhone").value.trim();
      const consent = document.getElementById("consentCheck").checked;
      const btn = document.getElementById("btnSubmit");

      if (!name) return alert("이름을 입력해 주세요.");
      if (!phone || phone.length < 10) return alert("올바른 휴대폰 번호를 입력해 주세요.");
      if (!consent) return alert("개인정보 수집 및 이용 동의에 체크해 주세요.");

      btn.innerText = "응모 데이터 전송 중...";
      btn.disabled = true;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone, score, consent })
        });

        alert("🎉 응모가 성공적으로 완료되었습니다!");
        location.reload();
      } catch (err) {
        alert("전송 중 일시적인 오류가 발생했습니다. 다시 시도해 주세요.");
        btn.innerText = "응모하기";
        btn.disabled = false;
      }
    }

    initBoard();
    gameLoop();
    startTimer();
  </script>
</body>
</html>
