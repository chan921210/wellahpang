<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>웰라팡</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #181926;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      width: 90%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
    }
    .badge span { color: #feca57; font-size: 17px; }
    #timer.warning { color: #ff4757; }

    #gameCanvas {
      background: #242638;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: block;
    }

    /* 팝업 모달 */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: #ffffff;
      color: #2d3436;
      padding: 28px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .modal-content h2 { font-size: 22px; margin-bottom: 4px; color: #1e1e2f; }
    .modal-content p.desc { font-size: 13px; color: #636e72; margin-bottom: 16px; }
    .score-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .score-title { font-size: 12px; color: #888; margin-bottom: 2px; }
    .score-value { font-size: 28px; color: #e84118; font-weight: 900; }

    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { font-size: 12px; font-weight: bold; color: #636e72; display: block; margin-bottom: 4px; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #dfe6e9;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .input-group input:focus { border-color: #e84118; }
    
    .consent-box {
      font-size: 12px;
      color: #636e72;
      text-align: left;
      margin: 14px 0 18px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }
    .consent-box input { margin-top: 3px; accent-color: #e84118; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #e84118;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(232, 65, 24, 0.3);
    }
    .btn-submit:disabled { background: #b2bec3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">남은 시간: <span id="timer">60</span>s</div>
    <div class="badge">점수: <span id="score">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- 게임 종료 및 이벤트 응모 모달 -->
  <div class="modal" id="resultModal">
    <div class="modal-content">
      <h2>🎉 게임 종료!</h2>
      <p class="desc">이벤트 참여 정보를 입력해 주세요.</p>
      
      <div class="score-card">
        <div class="score-title">최종 획득 점수</div>
        <div class="score-value"><span id="finalScore">0</span>점</div>
      </div>
      
      <div class="input-group">
        <label for="userName">이름</label>
        <input type="text" id="userName" placeholder="이름을 입력하세요">
      </div>
      <div class="input-group">
        <label for="userPhone">휴대폰 번호</label>
        <input type="tel" id="userPhone" placeholder="01012345678 (- 없이 입력)" maxlength="11">
      </div>
      
      <div class="consent-box">
        <input type="checkbox" id="consentCheck">
        <label for="consentCheck">[필수] 이벤트 추첨 및 경품 발송을 위한 개인정보 수집 및 이용에 동의합니다.</label>
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="submitEntry()">응모하기</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. 설정 (Apps Script URL)
    // ==========================================
    const GOOGLE_SCRIPT_URL = "여기에_구글_APPS_SCRIPT_URL을_붙여넣으세요";

    const GRID_SIZE = 6;
    const CANVAS_WIDTH = 340;
    const CANVAS_HEIGHT = 340;
    const TILE_SIZE = CANVAS_WIDTH / GRID_SIZE;

    // 아이템 ID (0~4: 일반 5개, 5: 폭탄, 6: 크로스, 7: 피버)
    const TYPE_BOMB = 5;
    const TYPE_CROSS = 6;
    const TYPE_FEVER = 7;

    // 이미지 경로 목록 (동일 폴더 기준)
    const IMAGE_SOURCES = {
      0: "item1.png",
      1: "item2.png",
      2: "item3.png",
      3: "item4.png",
      4: "item5.png",
      5: "bomb.png",
      6: "cross.png",
      7: "fever.png"
    };

    const TILE_BG_COLORS = [
      "#e5d4ff", "#e5d4ff", "#e5d4ff", "#e5d4ff", "#e5d4ff",
      "#ffd1d1", "#d8f8b7", "#ffeaa7"
    ];

    const images = {};
    for (let key in IMAGE_SOURCES) {
      const img = new Image();
      img.src = IMAGE_SOURCES[key];
      img.onload = () => {
        images[key] = img;
        drawBoard(); // 이미지 로딩 완료될 때마다 화면 갱신
      };
      img.onerror = () => {
        images[key] = null;
        drawBoard();
      };
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    let board = [];
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let isGameOver = false;

    let startPos = null;
    let startTile = null;

    // 둥근 사각형 호환 함수
    function fillRoundedRect(x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function getRandomNormalTile() {
      return Math.floor(Math.random() * 5);
    }

    function initBoard() {
      for (let r = 0; r < GRID_SIZE; r++) {
        board[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          board[r][c] = getRandomNormalTile();
        }
      }
      checkAndProcessMatches(false);
    }

    function drawBoard() {
      if (!board || board.length === 0) return;
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const type = board[r][c];
          if (type === -1) continue;

          const x = c * TILE_SIZE;
          const y = r * TILE_SIZE;

          // 타일 배경
          fillRoundedRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8, 12, TILE_BG_COLORS[type] || "#343752");

          // 이미지 렌더링
          if (images[type] && images[type].complete && images[type].naturalWidth > 0) {
            ctx.drawImage(images[type], x + 7, y + 7, TILE_SIZE - 14, TILE_SIZE - 14);
          }
        }
      }
    }

    // ==========================================
    // 👆 터치 & 마우스 조작 (PC/모바일 동시 지원)
    // ==========================================
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function handleStart(e) {
      if (isGameOver) return;
      const pos = getCoords(e);
      const col = Math.floor(pos.x / TILE_SIZE);
      const row = Math.floor(pos.y / TILE_SIZE);
      if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
        startPos = pos;
        startTile = { row, col };
      }
    }

    function handleEnd(e) {
      if (!startPos || !startTile || isGameOver) return;
      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      const rect = canvas.getBoundingClientRect();
      const dx = (clientX - rect.left) - startPos.x;
      const dy = (clientY - rect.top) - startPos.y;

      let targetTile = null;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
        targetTile = { row: startTile.row, col: startTile.col + (dx > 0 ? 1 : -1) };
      } else if (Math.abs(dy) > 20) {
        targetTile = { row: startTile.row + (dy > 0 ? 1 : -1), col: startTile.col };
      }

      if (targetTile && targetTile.row >= 0 && targetTile.row < GRID_SIZE && targetTile.col >= 0 && targetTile.col < GRID_SIZE) {
        swapTiles(startTile, targetTile);
      }
      startPos = null;
      startTile = null;
    }

    canvas.addEventListener("touchstart", handleStart, { passive: false });
    canvas.addEventListener("touchend", handleEnd, { passive: false });
    canvas.addEventListener("mousedown", handleStart);
    canvas.addEventListener("mouseup", handleEnd);

    function swapTiles(t1, t2) {
      const type1 = board[t1.row][t1.col];
      const type2 = board[t2.row][t2.col];

      // 피버 아이템 발동 체크
      if (type1 === TYPE_FEVER || type2 === TYPE_FEVER) {
        const targetIconType = type1 === TYPE_FEVER ? type2 : type1;
        board[t1.row][t1.col] = -1;
        board[t2.row][t2.col] = -1;
        activateFever(targetIconType);
        return;
      }

      board[t1.row][t1.col] = type2;
      board[t2.row][t2.col] = type1;

      if (!checkAndProcessMatches(true, t2)) {
        setTimeout(() => {
          board[t2.row][t2.col] = type2;
          board[t1.row][t1.col] = type1;
          drawBoard();
        }, 200);
      }
      drawBoard();
    }

    // ==========================================
    // 💥 특수 아이템 발동 로직
    // ==========================================
    function triggerSpecialTile(r, c, type) {
      if (type === TYPE_BOMB) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
              board[nr][nc] = -1;
              score += 150;
            }
          }
        }
      } else if (type === TYPE_CROSS) {
        for (let i = 0; i < GRID_SIZE; i++) {
          board[r][i] = -1;
          board[i][c] = -1;
          score += 200;
        }
      }
    }

    function activateFever(targetType) {
      let count = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] === targetType || targetType === TYPE_FEVER) {
            board[r][c] = -1;
            count++;
          }
        }
      }
      score += (count + 1) * 300;
      document.getElementById("score").innerText = score;
      drawBoard();
      setTimeout(dropAndRefill, 200);
    }

    // ==========================================
    // 🔍 매칭 판정 & 아이템 생성
    // ==========================================
    function checkAndProcessMatches(addScore, lastSwapPos = null) {
      let matched = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(false));
      let hRuns = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(1));
      let vRuns = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(1));
      let hasMatch = false;

      // 가로 체크
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] < 0 || board[r][c] > 4) continue;
          let matchLen = 1;
          while (c + matchLen < GRID_SIZE && board[r][c + matchLen] === board[r][c]) {
            matchLen++;
          }
          if (matchLen >= 3) {
            hasMatch = true;
            for (let k = 0; k < matchLen; k++) {
              matched[r][c + k] = true;
              hRuns[r][c + k] = matchLen;
            }
            c += matchLen - 1;
          }
        }
      }

      // 세로 체크
      for (let c = 0; c < GRID_SIZE; c++) {
        for (let r = 0; r < GRID_SIZE; r++) {
          if (board[r][c] < 0 || board[r][c] > 4) continue;
          let matchLen = 1;
          while (r + matchLen < GRID_SIZE && board[r + matchLen][c] === board[r][c]) {
            matchLen++;
          }
          if (matchLen >= 3) {
            hasMatch = true;
            for (let k = 0; k < matchLen; k++) {
              matched[r + k][c] = true;
              vRuns[r + k][c] = matchLen;
            }
            r += matchLen - 1;
          }
        }
      }

      if (hasMatch) {
        let spawnSpecial = null;

        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (matched[r][c]) {
              const h = hRuns[r][c];
              const v = vRuns[r][c];

              if (h >= 5 || v >= 5) spawnSpecial = { r, c, type: TYPE_FEVER };
              else if (h >= 3 && v >= 3 && !spawnSpecial) spawnSpecial = { r, c, type: TYPE_CROSS };
              else if ((h >= 4 || v >= 4) && !spawnSpecial) spawnSpecial = { r, c, type: TYPE_BOMB };

              if (board[r][c] >= 5) {
                triggerSpecialTile(r, c, board[r][c]);
              }

              board[r][c] = -1;
              if (addScore) score += 100;
            }
          }
        }

        if (spawnSpecial) {
          const target = lastSwapPos && matched[lastSwapPos.row][lastSwapPos.col] ? lastSwapPos : spawnSpecial;
          board[target.r || target.row][target.c || target.col] = spawnSpecial.type;
        }

        if (addScore) document.getElementById("score").innerText = score;
        dropAndRefill();
        return true;
      }
      return false;
    }

    function dropAndRefill() {
      for (let c = 0; c < GRID_SIZE; c++) {
        let emptyRow = GRID_SIZE - 1;
        for (let r = GRID_SIZE - 1; r >= 0; r--) {
          if (board[r][c] !== -1) {
            board[emptyRow][c] = board[r][c];
            if (emptyRow !== r) board[r][c] = -1;
            emptyRow--;
          }
        }
        for (let r = emptyRow; r >= 0; r--) {
          board[r][c] = getRandomNormalTile();
        }
      }
      drawBoard();
      setTimeout(() => checkAndProcessMatches(true), 250);
    }

    // ==========================================
    // ⏱️ 타이머 및 응모
    // ==========================================
    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById("timer");
        timerEl.innerText = timeLeft;
        if (timeLeft <= 10) timerEl.classList.add("warning");

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isGameOver = true;
      document.getElementById("finalScore").innerText = score.toLocaleString();
      document.getElementById("resultModal").style.display = "flex";
    }

    async function submitEntry() {
      const name = document.getElementById("userName").value.trim();
      const phone = document.getElementById("userPhone").value.trim();
      const consent = document.getElementById("consentCheck").checked;
      const btn = document.getElementById("btnSubmit");

      if (!name) return alert("이름을 입력해 주세요.");
      if (!phone || phone.length < 10) return alert("올바른 휴대폰 번호를 입력해 주세요.");
      if (!consent) return alert("개인정보 수집 및 이용 동의에 체크해 주세요.");

      btn.innerText = "응모 데이터 전송 중...";
      btn.disabled = true;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone, score, consent })
        });

        alert("🎉 응모가 성공적으로 완료되었습니다!");
        location.reload();
      } catch (err) {
        alert("전송 중 일시적인 오류가 발생했습니다. 다시 시도해 주세요.");
        btn.innerText = "응모하기";
        btn.disabled = false;
      }
    }

    // 초기화 & 첫 실행
    initBoard();
    drawBoard();
    startTimer();
  </script>
</body>
</html>
